<!-- Passline: the auth server's "invite" email (SPEC F9), fetched by URL. Uses Go template fields. -->
<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; color: #111">
  <h2 style="margin: 0 0 12px">You've been added to Passline</h2>
  <p>Set a password for {{ .Email }} to start using Passline.</p>
  <p style="margin: 24px 0">
    <a href="{{ .RedirectTo }}#{{ .TokenHash }}" style="background: #111; color: #fff; padding: 12px 20px; border-radius: 10px; text-decoration: none; display: inline-block">Set your password</a>
  </p>
  <p style="color: #555; font-size: 14px">The link works once. If it has expired, use "Forgot password" on the sign-in page.</p>
</div>

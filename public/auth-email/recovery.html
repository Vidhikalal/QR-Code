<!-- Passline: the auth server's "recovery" email (reset or first password), fetched by URL. -->
<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; color: #111">
  <h2 style="margin: 0 0 12px">Set a new Passline password</h2>
  <p>Someone (hopefully you) asked to set a password for {{ .Email }}.</p>
  <p style="margin: 24px 0">
    <a href="{{ .RedirectTo }}#{{ .TokenHash }}" style="background: #111; color: #fff; padding: 12px 20px; border-radius: 10px; text-decoration: none; display: inline-block">Set your password</a>
  </p>
  <p style="color: #555; font-size: 14px">The link works once. If you didn't ask for this, ignore this email; your password stays the same.</p>
</div>
